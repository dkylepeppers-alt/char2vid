version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # typescript-eslint / tooling peers currently require typescript <6.1;
    # ignore TS 7+ majors until the toolchain catches up.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      capacitor:
        patterns: ['@capacitor/*']
        update-types: [minor, patch]
      web-runtime:
        patterns:
          [react, react-dom, react-router, zod, '@tanstack/*', zustand, dexie]
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /apps/studio/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # AGP 8.13.x (com.android.tools.build:gradle:8.13.0) is only officially
    # compatible with Gradle 8.x. Gradle 9.6+ removed InternalProblems APIs
    # that AGP 8 uses (AndroidProblemReporterProvider), so wrapper 9.x bumps
    # fail plugin apply. Ignore until we migrate to AGP 9.
    ignore:
      - dependency-name: gradle-wrapper
        versions: ['>=9']
    groups:
      androidx:
        patterns: ['androidx.*']
        update-types: [minor, patch]
