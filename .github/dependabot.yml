version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns: ['@capacitor/*']
        update-types: [minor, patch]
      web-runtime:
        patterns:
          [react, react-dom, react-router, zod, '@tanstack/*', zustand, dexie]
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /apps/studio/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns: ['androidx.*']
        update-types: [minor, patch]
