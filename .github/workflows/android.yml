name: Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android SDK packages
        run: node scripts/install-android-sdk.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run android:sync
      - name: Check native project and build APK
        working-directory: apps/studio/android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Package debug download
        run: |
          mkdir -p artifacts
          cp apps/studio/android/app/build/outputs/apk/debug/app-debug.apk artifacts/char2vid-debug.apk
          cd artifacts
          sha256sum char2vid-debug.apk > SHA256SUMS.txt
      - name: Verify APK packages the current studio web build
        run: node scripts/verify-apk-web-assets.mjs artifacts/char2vid-debug.apk apps/studio/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: char2vid-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  instrumented:
    name: emulator-androidTest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 34
            target: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android SDK packages
        run: node scripts/install-android-sdk.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run android:sync
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          channel: stable
          sdcard-path-or-size: 512M
          working-directory: apps/studio/android
          # :app only — root connectedDebugAndroidTest also assembles
          # capacitor-cordova-android-plugins androidTest and fails on a
          # kotlin-stdlib / kotlin-stdlib-jdk8 duplicate-class clash.
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: androidTest-api${{ matrix.api-level }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/studio/android/app/build/reports/androidTests/connected/
            apps/studio/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
